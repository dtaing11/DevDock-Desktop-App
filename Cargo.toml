[package]
name = "git-manage"
version = "0.1.0"
description = "Native GitHub-Desktop-style git client for Linux with Ollama-powered commit messages"
edition = "2021"
license = "MIT"

[lib]
name = "git_manage"
path = "src/lib.rs"

[[bin]]
name = "git-manage"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = { version = "0.31", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
open = "5"
dirs = "6"
rfd = "0.15"
base64 = "0.22"
sha2 = "0.10"
toml = "0.8"
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true

[package.metadata.deb]
name = "git-manage"
depends = "libgtk-3-0, libxkbcommon0, git"
section = "devel"
priority = "optional"
extended-description = "Native GitHub-Desktop-style git client with GitHub sign-in, pull requests, conflict resolution, and AI commit messages (Ollama or Claude)."
assets = [
    ["target/release/git-manage", "usr/bin/", "755"],
    ["assets/git-manage.desktop", "usr/share/applications/", "644"],
    ["assets/icons/git-manage-256.png", "usr/share/icons/hicolor/256x256/apps/git-manage.png", "644"],
]
